# release.yml — item 30: cross-platform release pipeline.
#
# Lives at .github/workflows/release.yml. Fires on version tags (v*) or manual
# dispatch, builds all three desktop targets in parallel, and attaches the
# installers (.msi/.exe, .dmg, .AppImage/.deb) to a draft GitHub release.
#
# First run:  git tag v0.2.0 && git push origin v0.2.0
# Or:         Actions tab -> release -> Run workflow
#
# NOTE ON SIGNING: these artifacts are unsigned. Windows SmartScreen and macOS
# Gatekeeper will warn users until you add a code-signing certificate
# (tauri-action supports APPLE_CERTIFICATE / TAURI_SIGNING_PRIVATE_KEY secrets).

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # macOS runners are Apple Silicon: a universal .dmg also needs the
      # Intel target, or tauri's universal build dies after the ARM half.
      - name: macOS universal targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Item 30: bundle mpv into the Windows installer only. macOS users get it
      # from Homebrew and Linux users from their distro; the app's resolver
      # falls back to PATH / common locations there.
      # Item 30: fetch mpv, THEN opt the Windows bundle into shipping it.
      # The resource mapping is injected here (not committed in
      # tauri.windows.conf.json) so that local builds and `cargo check` never
      # depend on a downloaded binary existing.
      - name: Bundle mpv (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/fetch-mpv.ps1
          $conf = Get-Content src-tauri/tauri.windows.conf.json -Raw | ConvertFrom-Json
          $conf.bundle | Add-Member -NotePropertyName "resources" -NotePropertyValue ([pscustomobject]@{ "mpv/windows/mpv.exe" = "mpv/mpv.exe" }) -Force
          $conf | ConvertTo-Json -Depth 12 | Set-Content src-tauri/tauri.windows.conf.json -Encoding utf8
          Get-Content src-tauri/tauri.windows.conf.json

      - name: Build + publish draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "KuraPlay ${{ github.ref_name }}"
          releaseBody: "Installers below. Windows bundles mpv; macOS/Linux use your system mpv."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
